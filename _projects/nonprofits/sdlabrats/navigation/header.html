{%- comment -%} Header skeleton. labrats-site.js fills the section links and phone number from the backend. {%- endcomment -%}
<header class="labrats__header">
  <div class="labrats__wrap labrats__header-row">
    <a class="labrats__brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/images/projects/sdlabrats/labrats-logo.png' | relative_url }}" width="48" height="48" alt="">
      <span>San Diego <strong>LabRats</strong></span>
    </a>

    <button class="labrats__menu-toggle" type="button" aria-expanded="false" aria-controls="labrats-nav" data-labrats-menu-toggle>
      <span class="labrats__menu-icon" aria-hidden="true"></span>
      Menu
    </button>

    <nav class="labrats__nav" id="labrats-nav" aria-label="Main">
      <ul data-labrats-sections></ul>
      <a class="labrats__nav-phone" data-labrats-org-href="{phone_href}">Call <span data-labrats-org="phone"></span></a>
      <a class="labrats__nav-signin" data-labrats-session-link href="{{ '/sign-in/' | relative_url }}">Sign in</a>
    </nav>
  </div>
</header>
