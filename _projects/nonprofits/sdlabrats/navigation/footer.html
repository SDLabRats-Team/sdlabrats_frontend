{%- comment -%} Footer skeleton. labrats-site.js fills the text, site map, and social links from the backend. {%- endcomment -%}
<footer class="labrats__footer">
  <div class="labrats__wrap labrats__footer-grid">
    <section class="labrats__footer-about" aria-labelledby="footer-about-title">
      <h2 id="footer-about-title" data-labrats-org="name"></h2>
      <div data-labrats-footer-about></div>
    </section>

    <section aria-labelledby="footer-visit-title">
      <h2 id="footer-visit-title">Visit</h2>
      <address>
        <span data-labrats-org="address.name"></span><br>
        <span data-labrats-org="address.street"></span><br>
        <span data-labrats-org="address.city"></span>, <span data-labrats-org="address.region"></span> <span data-labrats-org="address.postal"></span>
      </address>
      <p data-labrats-org="hours"></p>
      <p><a data-labrats-org-href="{phone_href}"><span data-labrats-org="phone"></span></a></p>
      <p><a data-labrats-org-href="{address.map_url}" rel="noopener">Directions</a></p>
    </section>

    <nav class="labrats__footer-sitemap" aria-label="Site map" data-labrats-sitemap></nav>

    <section class="labrats__footer-signup" aria-labelledby="footer-signup-title">
      <div data-labrats-footer-signup></div>
      {% include projects/sdlabrats/form-newsletter.html %}
    </section>
  </div>

  <div class="labrats__wrap labrats__footer-base">
    <ul class="labrats__social" aria-label="LabRats on social media" data-labrats-social></ul>
    <label class="ocs__toggle">
      <input class="ocs__toggle-input" type="checkbox" role="switch" data-labrats-theme-toggle>
      <span class="ocs__toggle-track" aria-hidden="true"></span>
      <span class="ocs__toggle-label">Dark theme</span>
    </label>
    <p>&copy; <span data-labrats-year></span> <span data-labrats-org="name"></span></p>
  </div>
</footer>
